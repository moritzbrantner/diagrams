name: Dogfood format

on:
  push:
    branches:
      - feat/settings-dogfood-example-preferences

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/settings-dogfood-example-preferences
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Apply repository formatter
        run: |
          bun run format
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/src/example-settings.tsx examples/src/example-settings.e2e.spec.ts examples/src/examples.e2e.spec.ts
          git commit -m "Format settings dogfood files"
          git push origin HEAD:feat/settings-dogfood-example-preferences
