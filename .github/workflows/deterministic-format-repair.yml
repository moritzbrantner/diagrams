name: Deterministic format repair

on:
  pull_request:
    paths:
      - .github/workflows/deterministic-format-repair.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Apply exact repository formatter
        run: bunx oxfmt@0.53.0 --write src/structured-data.test.ts src/view-state.ts tsconfig.json
      - name: Print formatter diff
        run: git diff --no-ext-diff -- src/structured-data.test.ts src/view-state.ts tsconfig.json
