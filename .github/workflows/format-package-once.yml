name: Format diagrams package contract once

on:
  push:
    branches:
      - decouple-ui-peer

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: decouple-ui-peer
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx oxfmt --write src/package.test.ts
      - name: Verify focused package contract
        run: |
          bunx oxfmt --check src/package.test.ts
          bunx eslint src/package.test.ts
          bunx vitest run src/package.test.ts
          bun run check-types
      - name: Commit formatting
        run: |
          rm .github/workflows/format-package-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format diagrams package contract"
          git push origin HEAD:decouple-ui-peer
