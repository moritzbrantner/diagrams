name: Format Rust Once

on:
  push:
    branches:
      - feat/rust-diagram-core

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/rust-diagram-core

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt

      - name: Format
        run: cargo fmt --all

      - name: Commit formatter output
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/diagrams-core crates/diagrams-wasm
            git commit -m "style: format Clippy rewrite"
            git push origin HEAD:feat/rust-diagram-core
          fi
