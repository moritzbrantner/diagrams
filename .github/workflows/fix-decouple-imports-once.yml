name: Fix decoupling imports once

on:
  push:
    branches:
      - decouple-ui-peer

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: decouple-ui-peer
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fix migration import ordering
        run: |
          bunx eslint --fix \
            src/components/architecture-diagram.tsx \
            src/components/decision-tree.tsx \
            src/components/dependency-graph.tsx \
            src/components/dependency-graph/interactive-node.tsx \
            src/components/dependency-graph/node-shape.tsx \
            src/components/dependency-graph/parts.tsx \
            src/components/entity-relationship-diagram.tsx \
            src/components/journey-map.tsx \
            src/components/mind-map.tsx \
            src/components/sequence-diagram.tsx \
            src/components/state-machine-diagram.tsx \
            src/components/swimlane-diagram.tsx \
            src/components/timeline-diagram.tsx \
            src/components/uml-diagram/impl.tsx
      - name: Verify touched files
        run: |
          bunx eslint \
            src/components/architecture-diagram.tsx \
            src/components/decision-tree.tsx \
            src/components/dependency-graph.tsx \
            src/components/dependency-graph/interactive-node.tsx \
            src/components/dependency-graph/node-shape.tsx \
            src/components/dependency-graph/parts.tsx \
            src/components/entity-relationship-diagram.tsx \
            src/components/journey-map.tsx \
            src/components/mind-map.tsx \
            src/components/sequence-diagram.tsx \
            src/components/state-machine-diagram.tsx \
            src/components/swimlane-diagram.tsx \
            src/components/timeline-diagram.tsx \
            src/components/uml-diagram/impl.tsx
      - name: Commit fix
        run: |
          rm .github/workflows/fix-decouple-imports-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix diagrams decoupling import order"
          git push origin HEAD:decouple-ui-peer
