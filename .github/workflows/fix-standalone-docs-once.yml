name: Fix standalone diagrams docs once

on:
  push:
    branches:
      - decouple-ui-peer

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: decouple-ui-peer
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Remove stale UI styling contract
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()
          stale_install = '''Import the shared UI stylesheet once in your app:\n\n```ts\nimport "@moritzbrantner/ui/atlas/styles.css";\n```\n\n'''
          if stale_install not in text:
              raise SystemExit("stale install block changed")
          text = text.replace(stale_install, "", 1)

          stale_row = '| `@moritzbrantner/ui` | `^1.0.0`                    | Provides the shared Atlas stylesheet and design tokens. |\n'
          if stale_row not in text:
              raise SystemExit("stale support row changed")
          text = text.replace(stale_row, "", 1)

          old_styling = '''## Styling Contract\n\nDiagram components use the shared Atlas token classes from `@moritzbrantner/ui`. Import the\nstylesheet once in the consuming app before rendering diagrams:\n\n```ts\nimport "@moritzbrantner/ui/atlas/styles.css";\n```\n\nThe package does not inject global styles at runtime. If the stylesheet is omitted, diagrams still\nrender structurally, but colors, spacing, borders, focus rings, and dark-mode tokens are not\nguaranteed to match the documented examples.\n'''
          new_styling = '''## Styling Contract\n\nDiagram renderers own their visual contract. Import the package stylesheet once in the consuming\napp:\n\n```ts\nimport "@moritzbrantner/diagrams/styles.css";\n```\n\nThe stylesheet defines the diagram defaults and `--diagrams-*` custom properties. Consumers may\noverride those properties to integrate with another design system, but `@moritzbrantner/ui` is not\nrequired at runtime or as a peer dependency.\n'''
          if old_styling not in text:
              raise SystemExit("stale styling section changed")
          path.write_text(text.replace(old_styling, new_styling, 1))
          PY
      - run: bunx oxfmt --write README.md
      - name: Verify docs
        run: |
          bunx oxfmt --check README.md
          bun run docs:check
      - name: Commit docs
        run: |
          rm .github/workflows/fix-standalone-docs-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document standalone diagram styling"
          git push origin HEAD:decouple-ui-peer
