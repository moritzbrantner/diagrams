name: Diagnose API report

on:
  push:
    branches:
      - diag/api-report-diff
    paths:
      - .github/workflows/diagnose-api-report.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/current-lint-regressions
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate API report candidate
        run: |
          bun run build
          node ./scripts/check-api-report.mjs || true
          test -f temp/diagrams.api.md
          diff -u etc/diagrams.api.md temp/diagrams.api.md || true
