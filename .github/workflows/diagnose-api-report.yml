name: Generate API report repair

on:
  push:
    branches:
      - diag/api-report-diff
    paths:
      - .github/workflows/diagnose-api-report.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/current-lint-regressions
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate exact public API report
        run: |
          bun run build
          node ./scripts/check-api-report.mjs || true
          test -f temp/diagrams.api.md
          cp temp/diagrams.api.md etc/diagrams.api.md
      - name: Validate generated report
        run: |
          bun run api:check
          bun run format:check
          git diff --check
      - name: Commit generated report to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etc/diagrams.api.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: refresh generated public API report"
          git push origin HEAD:fix/current-lint-regressions
