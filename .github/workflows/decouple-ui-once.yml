name: Decouple UI once

on:
  push:
    branches:
      - decouple-ui-peer

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: decouple-ui-peer
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - name: Apply narrow decoupling
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          src_root = Path("src")
          changed_cn_imports = 0
          for path in [*src_root.rglob("*.ts"), *src_root.rglob("*.tsx")]:
              text = path.read_text()
              exact = 'import { cn } from "@moritzbrantner/ui";'
              if exact not in text:
                  continue
              rel = os.path.relpath(src_root / "internal" / "cn", path.parent).replace(os.sep, "/")
              if not rel.startswith("."):
                  rel = "./" + rel
              path.write_text(text.replace(exact, f'import {{ cn }} from "{rel}";'))
              changed_cn_imports += 1

          if changed_cn_imports == 0:
              raise SystemExit("expected production cn imports from @moritzbrantner/ui")

          for path in [*src_root.rglob("*.ts"), *src_root.rglob("*.tsx")]:
              if ".test." in path.name or ".spec." in path.name or "stories" in path.parts:
                  continue
              if "@moritzbrantner/ui" in path.read_text():
                  raise SystemExit(f"production UI import remains in {path}")

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          peer = package.setdefault("peerDependencies", {})
          if peer.pop("@moritzbrantner/ui", None) is None:
              raise SystemExit("expected @moritzbrantner/ui peer dependency")
          package["sideEffects"] = ["*.css"]
          package.setdefault("exports", {})["./styles.css"] = "./dist/styles.css"
          styles_build = "vite build --config vite.styles.config.ts"
          if styles_build not in package["scripts"]["build"]:
              package["scripts"]["build"] += f" && {styles_build}"
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          example_styles = Path("examples/src/styles.css")
          text = example_styles.read_text()
          ui_style = '@import "@moritzbrantner/ui/atlas/styles.css";'
          if ui_style in text:
              text = text.replace(ui_style, '@import "../../src/styles.css";')
          example_styles.write_text(text)

          readme = Path("README.md")
          text = readme.read_text()
          text = text.replace(
              "bun add @moritzbrantner/diagrams @moritzbrantner/ui react react-dom",
              "bun add @moritzbrantner/diagrams react react-dom",
          )
          installation_marker = "```\n\n"
          if "@moritzbrantner/diagrams/styles.css" not in text:
              heading = "## Installation"
              start = text.find(heading)
              fence_end = text.find(installation_marker, start)
              if start < 0 or fence_end < 0:
                  raise SystemExit("README installation section changed")
              insert_at = fence_end + len(installation_marker)
              note = (
                  "Import the package-owned stylesheet once when using the React renderers:\n\n"
                  "```ts\nimport \"@moritzbrantner/diagrams/styles.css\";\n```\n\n"
                  "The published package does not require `@moritzbrantner/ui`. Theme surfaces can be\n"
                  "overridden with the `--diagrams-*` CSS custom properties.\n\n"
              )
              text = text[:insert_at] + note + text[insert_at:]
          readme.write_text(text)

          check = Path("scripts/check-packed-artifact.mjs")
          text = check.read_text()
          text = text.replace(
              '  assertPeerDependency(packageJson, "@moritzbrantner/ui", "^1.0.0");\n',
              '',
          )
          text = text.replace(
              '          "@moritzbrantner/ui": packageJson.peerDependencies["@moritzbrantner/ui"],\n',
              '',
          )
          package_assert = '  assertFile(path.join(packageDir, "package.json"));\n'
          style_assert = '  assertFile(path.join(packageDir, "dist", "styles.css"));\n'
          if style_assert not in text:
              text = text.replace(package_assert, package_assert + style_assert)
          react_peer = '  assertPeerDependency(packageJson, "react", "^19.0.0");\n'
          independence = '''  if (\n    packageJson.dependencies?.["@moritzbrantner/ui"] ||\n    packageJson.peerDependencies?.["@moritzbrantner/ui"]\n  ) {\n    throw new Error("Packed diagrams package must not require @moritzbrantner/ui.");\n  }\n\n'''
          if "Packed diagrams package must not require" not in text:
              text = text.replace(react_peer, independence + react_peer)
          check.write_text(text)
          PY
      - name: Refresh lockfile and install
        run: bun install
      - name: Format
        run: bun run format
      - name: Check types
        run: bun run check-types
      - name: Build package
        run: bun run build
      - name: Build examples
        run: bun run build:examples
      - name: Check packed consumer
        run: bun run pack:check
      - name: Commit migration
        run: |
          rm .github/workflows/decouple-ui-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Decouple diagrams runtime from ui"
          git push origin HEAD:decouple-ui-peer
