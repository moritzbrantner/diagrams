name: Agent diagrams migration bootstrap

on:
  push:
    branches:
      - agent/conventions-package-boundary

permissions:
  contents: write

jobs:
  bootstrap:
    if: contains(github.event.head_commit.message, 'diagrams migration bootstrap')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Apply migration edits
        run: node scripts/agent-align-boundaries.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed files
        run: >-
          bunx oxfmt --write
          package.json tsconfig.json README.md examples/src/styles.css
          src/core.ts src/react.ts src/view-state.ts src/view-state.test.ts

      - name: Check types
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build package
        run: bun run build

      - name: Check docs and API
        run: bun run docs:check && bun run api:check

      - name: Check packed artifact
        run: bun run pack:check

      - name: Build examples
        run: bun run build:examples

      - name: Benchmark representative diagrams
        run: bun run bench:diagrams

      - name: Commit implementation
        run: |
          rm scripts/agent-align-boundaries.mjs .github/workflows/agent-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align diagrams with convention package boundaries"
          git push origin HEAD:agent/conventions-package-boundary
