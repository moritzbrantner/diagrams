name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  RUST_VERSION: 1.98.1
  WASM_BINDGEN_VERSION: 0.2.128
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  workflow-validation:
    name: Workflow Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Check workflow files
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6

      - name: Check Dependency Graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dependency Graph is unavailable; falling back to repository-owned JavaScript and Rust advisory checks."
          fi

      - name: Dependency review
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@v5

      - name: Set up Bun fallback
        if: steps.dependency-graph.outputs.available != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JavaScript dependencies for fallback audit
        if: steps.dependency-graph.outputs.available != 'true'
        run: bun install --frozen-lockfile

      - name: Production dependency audit fallback
        if: steps.dependency-graph.outputs.available != 'true'
        run: bun run audit:production

      - name: Set up Rust fallback
        if: steps.dependency-graph.outputs.available != 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install pinned Rust advisory auditor
        if: steps.dependency-graph.outputs.available != 'true'
        run: cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked

      - name: Rust advisory audit fallback
        if: steps.dependency-graph.outputs.available != 'true'
        run: cargo audit

  build-package:
    name: Build or reuse compiled package
    needs: workflow-validation
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@544af51c921b09b4452b7346347ec9effa58f179
    secrets: inherit
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: diagrams-compiled-package-v1
      node_version: "24"
      bun_version: "1.3.14"
      rust_toolchain: "1.98.1"
      rust_targets: wasm32-unknown-unknown
      cache_bun: true
      bun_cache_dependency_path: bun.lock
      cache_cargo: true
      cargo_cache_dependency_path: Cargo.lock
      use_environment_v1: false
      setup_command: |
        bun install --frozen-lockfile
        cargo install wasm-bindgen-cli --version 0.2.128 --locked
      build_command: |
        bun run build
        bun run build:wasm
      artifact_paths: dist
      reuse_across_runs: true
      artifact_retention_days: 7

  rust-core:
    name: Rust Core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: workflow-validation
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --locked --workspace

      - name: Benchmark representative graph
        run: cargo run --locked -p diagrams-core --release --example benchmark

      - name: Check WASM target
        run: cargo build --locked -p diagrams-wasm --target wasm32-unknown-unknown --release

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: workflow-validation
    permissions:
      contents: read
      packages: read
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache Bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Check docs
        run: bun run docs:check

      - name: Test with coverage
        run: bun run test:coverage

      - name: Check public API report
        run: bun run api:check

      - name: Production dependency audit
        run: bun run audit:production

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - quality
      - rust-core
      - build-package
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-package.outputs.source_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache Bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Consume verified compiled package
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@544af51c921b09b4452b7346347ec9effa58f179
        with:
          producer_run_id: ${{ needs.build-package.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-package.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
          source_sha: ${{ needs.build-package.outputs.source_sha }}
          artifact_key: ${{ needs.build-package.outputs.artifact_key }}
          identity_digest: ${{ needs.build-package.outputs.identity_digest }}
          destination_path: .artifacts/diagrams-package
          github_token: ${{ github.token }}

      - name: Stage compiled package
        run: |
          rm -rf dist
          cp -R .artifacts/diagrams-package/dist ./dist

      - name: Build examples and docs from prepared WASM
        run: bun run build:examples:prepared

      - name: Build Storybook
        run: bun run build:storybook

      - name: Check package artifact
        run: bunx publint --pack bun --strict && node ./scripts/check-packed-artifact.mjs

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - quality
      - rust-core
      - build-package
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-package.outputs.source_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache Bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Consume verified compiled package
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@544af51c921b09b4452b7346347ec9effa58f179
        with:
          producer_run_id: ${{ needs.build-package.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-package.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
          source_sha: ${{ needs.build-package.outputs.source_sha }}
          artifact_key: ${{ needs.build-package.outputs.artifact_key }}
          identity_digest: ${{ needs.build-package.outputs.identity_digest }}
          destination_path: .artifacts/diagrams-package
          github_token: ${{ github.token }}

      - name: Stage compiled package
        run: |
          rm -rf dist
          cp -R .artifacts/diagrams-package/dist ./dist

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Run e2e tests against prepared WASM
        run: bunx playwright test

      - name: Build Storybook
        run: bun run build:storybook

      - name: Run Storybook interaction tests
        run: bun run test:storybook

      - name: Run visual checks
        run: bun run test:visual

      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-artifacts
          if-no-files-found: ignore
          path: |
            storybook-static
            playwright-report
            test-results

  page-quality:
    name: Page Quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - package
      - build-package
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-package.outputs.source_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache Bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Consume verified compiled package
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@544af51c921b09b4452b7346347ec9effa58f179
        with:
          producer_run_id: ${{ needs.build-package.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-package.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
          source_sha: ${{ needs.build-package.outputs.source_sha }}
          artifact_key: ${{ needs.build-package.outputs.artifact_key }}
          identity_digest: ${{ needs.build-package.outputs.identity_digest }}
          destination_path: .artifacts/diagrams-package
          github_token: ${{ github.token }}

      - name: Stage compiled package
        run: |
          rm -rf dist
          cp -R .artifacts/diagrams-package/dist ./dist

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run Unlighthouse from prepared WASM
        env:
          DIAGRAMS_PREBUILT_WASM: "1"
        run: bun run test:unlighthouse

      - name: Upload page-quality artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: page-quality-artifacts
          path: .unlighthouse/
