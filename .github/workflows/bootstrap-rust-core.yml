name: Bootstrap Rust Core

on:
  push:
    branches:
      - feat/rust-diagram-core
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-rust-diagram-core
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  RUST_VERSION: 1.98.1

jobs:
  fix-generated-style:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/rust-diagram-core

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format Rust
        run: cargo fmt --all

      - name: Apply Clippy suggestions
        run: cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged -- -D warnings

      - name: Format new web files
        run: >-
          ./node_modules/.bin/oxfmt --write
          Cargo.toml
          scripts/build-diagrams-wasm.mjs
          src/components/architecture-diagram-rust.tsx
          src/wasm-runtime.ts

      - name: Commit bootstrap output
        run: |
          if ! git diff --quiet || [ -f Cargo.lock ] && ! git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock Cargo.toml crates/diagrams-core crates/diagrams-wasm scripts/build-diagrams-wasm.mjs src/components/architecture-diagram-rust.tsx src/wasm-runtime.ts
            git commit -m "style: normalize Rust core migration"
            git push origin HEAD:feat/rust-diagram-core
          fi
