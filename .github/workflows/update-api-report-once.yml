name: Refresh diagrams API report once

on:
  push:
    branches:
      - decouple-ui-peer

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: decouple-ui-peer
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Generate current API report
        run: |
          bun run build
          node ./scripts/check-api-report.mjs || test -f temp/diagrams.api.md
          cp temp/diagrams.api.md etc/diagrams.api.md
          bunx oxfmt --write etc/diagrams.api.md
      - name: Verify API report
        run: |
          node ./scripts/check-api-report.mjs
          bun run check-types
          bun run lint
          bun run format:check
      - name: Commit API report
        run: |
          rm .github/workflows/update-api-report-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh diagrams public API report"
          git push origin HEAD:decouple-ui-peer
