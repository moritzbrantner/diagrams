name: Pages

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  resolve-package:
    name: Reuse compiled package
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@5291d5162b128faca9dd83edba24e7342730e604
    secrets: inherit
    with:
      source_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      artifact_key: diagrams-compiled-package-v1
      node_version: "24"
      bun_version: "1.3.14"
      rust_toolchain: "1.98.1"
      rust_targets: wasm32-unknown-unknown
      cache_bun: true
      bun_cache_dependency_path: bun.lock
      cache_cargo: true
      cargo_cache_dependency_path: Cargo.lock
      use_environment_v1: false
      setup_command: |
        bun install --frozen-lockfile
        cargo install wasm-bindgen-cli --version 0.2.128 --locked
      build_command: |
        bun run build
        bun run build:wasm
      artifact_paths: dist
      reuse_across_runs: true
      artifact_retention_days: 7

  compose-pages:
    name: Compose Pages from compiled package
    needs: resolve-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      pages: write
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-package.outputs.source_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Consume verified compiled package
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@5291d5162b128faca9dd83edba24e7342730e604
        with:
          producer_run_id: ${{ needs.resolve-package.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.resolve-package.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.resolve-package.outputs.artifact_name }}
          artifact_digest: ${{ needs.resolve-package.outputs.artifact_digest }}
          source_sha: ${{ needs.resolve-package.outputs.source_sha }}
          artifact_key: ${{ needs.resolve-package.outputs.artifact_key }}
          identity_digest: ${{ needs.resolve-package.outputs.identity_digest }}
          destination_path: .artifacts/diagrams-package
          github_token: ${{ github.token }}

      - name: Stage compiled package
        run: |
          rm -rf dist
          cp -R .artifacts/diagrams-package/dist ./dist

      - name: Build Pages composition without recompiling WASM
        run: BASE_PATH=/diagrams/ bun run build:examples:prepared

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-examples

  deploy-pages:
    name: Deploy Pages
    needs: compose-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
