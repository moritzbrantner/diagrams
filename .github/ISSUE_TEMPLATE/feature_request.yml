name: Feature request
description: Propose a new diagram primitive, helper, or workflow.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What diagramming workflow or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the API, behavior, or documentation you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other designs have you tried?
    validations:
      required: false
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility notes
      description: Any expected impact on React 19, @moritzbrantner/ui, bundlers, or existing APIs.
    validations:
      required: false
